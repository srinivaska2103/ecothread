<!DOCTYPE html>
<html lang="en" x-data="appData()" :class="{ 'dark': darkMode }" :dir="layoutDir">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" href="assets/letter-e.png">
    <title>Login | EcoThread</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#2D5A27' }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 transition-colors duration-500 flex items-center justify-center min-h-screen p-4">

   <header class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-50">
                       <a href="index.html" class="group transition-opacity hover:opacity-90">
    <div class="flex-shrink-0 flex items-center gap-3">
        <!-- Brand Icon: Standardized to 32px (w-8 h-8) -->
        <div class="w-8 h-8 bg-primary rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-sm">
            E
        </div>
        
        <!-- Brand Text: Aligned with the Icon -->
        <span class="text-xl font-black tracking-tighter text-primary dark:text-green-400 uppercase">
            Eco <span class="text-zinc-900 dark:text-white">Thread</span>
        </span>
    </div>
</a>

        <div class="flex items-center gap-2">
            <button @click="toggleLayout()" class="p-2.5 rounded-xl bg-white dark:bg-zinc-800 border dark:border-zinc-700 shadow-sm text-[10px] font-black" title="Switch Direction">
                <span x-text="layoutDir.toUpperCase()"></span>
            </button>
            <button @click="toggleDark()" class="p-2.5 rounded-xl bg-white dark:bg-zinc-800 border dark:border-zinc-700 shadow-sm transition-all">
                <i x-show="!darkMode" data-lucide="moon" class="w-4 h-4"></i>
                <i x-show="darkMode" data-lucide="sun" class="w-4 h-4 text-yellow-500"></i>
            </button>
        </div>
    </header>

    <main class="w-full max-w-md bg-white dark:bg-zinc-900 rounded-[2.5rem] shadow-2xl shadow-zinc-200 dark:shadow-none border dark:border-zinc-800 p-8 md:p-12 transition-all"
          x-data="{ showPass: false }">
        
        <div class="space-y-8">
            <div class="text-center space-y-2">
                <h2 class="text-3xl md:text-4xl font-black tracking-tighter">Welcome Back</h2>
                <p class="text-zinc-500 dark:text-zinc-400 text-sm">Sign in to your sustainable account</p>
            </div>

       <div class="grid grid-cols-3 gap-3">
    <a href="https://google.com" target="_blank" 
       class="flex justify-center items-center py-3 border dark:border-zinc-700 rounded-2xl hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-all group">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-600 dark:text-zinc-400 group-hover:scale-110 transition-transform">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="21.17" y1="8" x2="12" y2="8"></line>
            <line x1="3.95" y1="6.06" x2="8.54" y2="14"></line>
            <line x1="10.88" y1="21.94" x2="15.46" y2="14"></line>
        </svg>
    </a>

    <a href="https://github.com" target="_blank" 
       class="flex justify-center items-center py-3 border dark:border-zinc-700 rounded-2xl hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-all group">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-600 dark:text-zinc-400 group-hover:scale-110 transition-transform">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
        </svg>
    </a>

   <!-- Apple Link -->
<a href="https://apple.com" target="_blank" 
   class="flex justify-center items-center py-3 border dark:border-zinc-700 rounded-2xl hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-all group">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-apple" viewBox="0 0 16 16">
  <path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422s1.675-2.789 1.698-2.854-.597-.79-1.254-1.157a3.7 3.7 0 0 0-1.563-.434c-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56s.625 1.924 1.273 2.796c.576.984 1.34 1.667 1.659 1.899s1.219.386 1.843.067c.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758q.52-1.185.473-1.282"/>
  <path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422s1.675-2.789 1.698-2.854-.597-.79-1.254-1.157a3.7 3.7 0 0 0-1.563-.434c-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56s.625 1.924 1.273 2.796c.576.984 1.34 1.667 1.659 1.899s1.219.386 1.843.067c.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758q.52-1.185.473-1.282"/>
</svg>
</a>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>

            <div class="relative flex items-center">
                <div class="flex-grow border-t dark:border-zinc-800"></div>
                <span class="mx-4 text-[10px] font-black uppercase tracking-widest text-zinc-400">or use email</span>
                <div class="flex-grow border-t dark:border-zinc-800"></div>
            </div>

            <form class="space-y-5">
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-zinc-500 ml-1">Email</label>
                    <div class="relative group">
                        <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400 group-focus-within:text-primary transition-colors"></i>
                        <input type="email" placeholder="srinivas@eco.com" class="w-full pl-12 pr-4 py-4 bg-zinc-50 dark:bg-zinc-800/50 border-2 border-transparent focus:border-primary focus:bg-white dark:focus:bg-zinc-800 rounded-2xl outline-none transition-all text-sm">
                    </div>
                </div>

               <div class="space-y-3" x-data="{ showPass: false, rememberMe: false }">
    <!-- Label -->
    <div class="flex justify-between items-center px-1">
        <label class="text-[10px] font-black uppercase tracking-widest text-zinc-500">Password</label>
    </div>

    <!-- Password Input -->
    <div class="relative group">
        <!-- Lock Icon (Inline SVG) -->
        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 group-focus-within:text-primary transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>

        <input :type="showPass ? 'text' : 'password'" 
               placeholder="••••••••" 
               class="w-full pl-12 pr-12 py-4 bg-zinc-50 dark:bg-zinc-800/50 border-2 border-transparent focus:border-primary focus:bg-white dark:focus:bg-zinc-800 rounded-2xl outline-none transition-all text-sm">
        
        <!-- Toggle Visibility Button -->
        <button type="button" @click="showPass = !showPass" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-primary transition-colors">
            <!-- Eye Icon -->
            <svg x-show="!showPass" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <!-- Eye Off Icon -->
            <svg x-show="showPass" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88 3 3"></path><path d="M17.32 17.32 21 21"></path><path d="M2 11.07a10 10 0 0 0 16.63 5.54"></path><path d="M18 18.06A10 10 0 0 0 2 12a10 10 0 0 0 5 8.79"></path><path d="m15 15-3-3"></path><path d="m15 9-6 6"></path><path d="M22 12c0 2.68-1.56 5.3-4.5 6.4"></path></svg>
        </button>
    </div>

    <!-- Bottom Actions: Remember Me & Forgot Password -->
    <div class="flex items-center justify-between px-1 mt-2">
        <!-- Remember Me Custom Checkbox -->
        <label class="flex items-center gap-2 cursor-pointer group">
            <div class="relative flex items-center justify-center">
                <input type="checkbox" x-model="rememberMe" class="peer sr-only">
                <div class="w-4 h-4 border-2 border-zinc-300 dark:border-zinc-700 rounded-md peer-checked:border-primary peer-checked:bg-primary transition-all"></div>
                <!-- Checkmark Icon -->
                <svg class="absolute w-3 h-3 text-white opacity-0 peer-checked:opacity-100 transition-opacity" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <span class="text-[10px] font-bold text-zinc-500 group-hover:text-zinc-700 dark:group-hover:text-zinc-300 transition-colors uppercase tracking-widest">Remember Me</span>
        </label>

        <!-- Forgot Password Link -->
        <a href="#" class="text-[10px] font-black text-primary hover:text-green-600 transition-colors uppercase tracking-widest">Forgot Password?</a>
    </div>
</div>
              
                     <button class="w-full bg-primary text-white py-5 rounded-2xl font-black text-lg shadow-xl shadow-green-900/10 hover:opacity-90 active:scale-[0.98] transition-all">
                    Sign In
                </button>
              
               
            </form>

            <p class="text-center text-xs text-zinc-500">
                New here? <a href="regesiter.html" class="font-black text-primary hover:underline">Create Account</a>
            </p>
        </div>
    </main>

    <script>
        function appData() {
            return {
                darkMode: localStorage.getItem('dark-mode') === 'true',
                layoutDir: localStorage.getItem('layout-dir') || 'ltr',
                toggleDark() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('dark-mode', this.darkMode);
                },
                toggleLayout() {
                    this.layoutDir = this.layoutDir === 'ltr' ? 'rtl' : 'ltr';
                    localStorage.setItem('layout-dir', this.layoutDir);
                },
                init() { lucide.createIcons(); }
            }
        }
    </script>
</body>
</html>
