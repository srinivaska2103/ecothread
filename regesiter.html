<!DOCTYPE html>
<html lang="en" x-data="appData()" :class="{ 'dark': darkMode }" :dir="layoutDir">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <link rel="icon" href="assets/letter-e.png">

    <title>Join the Movement | EcoThread Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        primary: '#2D5A27',
                        secondary: '#F4F1EA' 
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 transition-colors duration-500 flex items-center justify-center min-h-screen p-4">

 <!-- Header: Adjusted padding and icon size for 360px -->
    <header class="absolute top-0 left-0 w-full p-4 md:p-6 flex justify-between items-center z-50">
        <a href="index.html" class="flex items-center gap-2 group">
            <div class="w-7 h-7 md:w-8 md:h-8 bg-primary rounded-xl flex items-center justify-center text-white font-bold transition-transform group-hover:rotate-12 shadow-lg">E</div>
            <span class="text-lg font-black tracking-tighter text-primary dark:text-green-400 uppercase">
                Eco <span class="text-zinc-900 dark:text-white">Thread</span>
            </span>
        </a>

        <div class="flex items-center gap-1.5 md:gap-2">
            <button @click="toggleLayout()" class="p-2 md:p-2.5 rounded-xl bg-white dark:bg-zinc-800 border dark:border-zinc-700 shadow-sm text-[9px] font-black" title="Switch Direction">
                <span x-text="layoutDir.toUpperCase()"></span>
            </button>
            <button @click="toggleDark()" class="p-2 md:p-2.5 rounded-xl bg-white dark:bg-zinc-800 border dark:border-zinc-700 shadow-sm transition-all">
                <i x-show="!darkMode" data-lucide="moon" class="w-3.5 h-3.5"></i>
                <i x-show="darkMode" data-lucide="sun" class="w-3.5 h-3.5 text-yellow-500"></i>
            </button>
        </div>
    </header>

    <!-- Main: Added mt-16 for mobile to clear header; adjusted rounded corners and padding -->
    <main class="w-full max-w-xl bg-white dark:bg-zinc-900 rounded-[2rem] md:rounded-[2.5rem] shadow-2xl shadow-zinc-200 dark:shadow-none border dark:border-zinc-800 p-5 md:p-12 mt-16 mb-6 md:mt-0 transition-all">
        
        <div class="space-y-6 md:space-y-8">
            <div class="text-center space-y-1">
                <h2 class="text-2xl md:text-4xl font-black tracking-tighter">Create Account</h2>
                <p class="text-zinc-500 dark:text-zinc-400 text-[11px] md:text-sm">Join 10k+ rebels wearing the change.</p>
            </div>

            <!-- Social Icons: Reduced padding for 360px -->
            <div class="grid grid-cols-3 gap-2 md:gap-3">
                <a href="#" class="flex justify-center items-center py-2.5 border dark:border-zinc-700 rounded-xl hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-all group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-600 dark:text-zinc-400 group-hover:scale-110 transition-transform"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4"></circle><line x1="21.17" y1="8" x2="12" y2="8"></line><line x1="3.95" y1="6.06" x2="8.54" y2="14"></line><line x1="10.88" y1="21.94" x2="15.46" y2="14"></line></svg>
                </a>
                <a href="#" class="flex justify-center items-center py-2.5 border dark:border-zinc-700 rounded-xl hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-all group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-600 dark:text-zinc-400 group-hover:scale-110 transition-transform"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
                </a>
                <a href="#" class="flex justify-center items-center py-2.5 border dark:border-zinc-700 rounded-xl hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-all group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="text-zinc-600 dark:text-zinc-400" viewBox="0 0 16 16"><path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422s1.675-2.789 1.698-2.854-.597-.79-1.254-1.157a3.7 3.7 0 0 0-1.563-.434c-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56s.625 1.924 1.273 2.796c.576.984 1.34 1.667 1.659 1.899s1.219.386 1.843.067c.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758q.52-1.185.473-1.282"/></svg>
                </a>
            </div>

            <div class="relative flex items-center">
                <div class="flex-grow border-t dark:border-zinc-800"></div>
                <span class="mx-3 text-[9px] font-black uppercase tracking-widest text-zinc-400 whitespace-nowrap">or sign up with email</span>
                <div class="flex-grow border-t dark:border-zinc-800"></div>
            </div>

            <form class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-zinc-500 ml-1">Full Name</label>
                        <input type="text" placeholder="Srinivas K A" class="w-full px-4 py-3.5 bg-zinc-50 dark:bg-zinc-800/50 border-2 border-transparent focus:border-primary focus:bg-white dark:focus:bg-zinc-800 rounded-xl md:rounded-2xl outline-none transition-all text-sm">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase tracking-widest text-zinc-500 ml-1">Email</label>
                        <input type="email" placeholder="hello@eco.com" class="w-full px-4 py-3.5 bg-zinc-50 dark:bg-zinc-800/50 border-2 border-transparent focus:border-primary focus:bg-white dark:focus:bg-zinc-800 rounded-xl md:rounded-2xl outline-none transition-all text-sm">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[9px] font-black uppercase tracking-widest text-zinc-500 ml-1">Password</label>
                    <div class="relative group">
                        <input :type="showPass ? 'text' : 'password'" placeholder="Create a password" class="w-full pl-4 pr-11 py-3.5 bg-zinc-50 dark:bg-zinc-800/50 border-2 border-transparent focus:border-primary focus:bg-white dark:focus:bg-zinc-800 rounded-xl md:rounded-2xl outline-none transition-all text-sm">
                        <button type="button" @click="showPass = !showPass" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-primary">
                            <i x-show="!showPass" data-lucide="eye" class="w-4 h-4"></i>
                            <i x-show="showPass" data-lucide="eye-off" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-start gap-2.5 px-1 py-1">
                    <input type="checkbox" class="mt-0.5 w-3.5 h-3.5 rounded border-zinc-300 text-primary focus:ring-primary">
                    <p class="text-[10px] text-zinc-500 leading-snug">
                        I agree to the <a href="#" class="text-primary font-bold">Terms</a> and 
                        <a href="#" class="text-primary font-bold">Privacy</a>.
                    </p>
                </div>

                <button class="w-full bg-primary text-white py-4 md:py-5 rounded-xl md:rounded-2xl font-black text-sm md:text-lg shadow-xl shadow-green-900/10 active:scale-[0.98] transition-all">
                    Create Account
                </button>
            </form>

            <p class="text-center text-[11px] text-zinc-500">
                Already a member? <a href="login.html" class="font-black text-primary hover:underline">Sign In</a>
            </p>
        </div>
    </main>

    <script>
        function appData() {
            return {
                darkMode: localStorage.getItem('dark-mode') === 'true',
                layoutDir: localStorage.getItem('layout-dir') || 'ltr',
                toggleDark() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('dark-mode', this.darkMode);
                    // Re-run lucide when icons are toggled via x-show
                    this.$nextTick(() => { lucide.createIcons(); });
                },
                toggleLayout() {
                    this.layoutDir = this.layoutDir === 'ltr' ? 'rtl' : 'ltr';
                    localStorage.setItem('layout-dir', this.layoutDir);
                },
                init() {
                    // This fires when Alpine is ready
                    lucide.createIcons();
                }
            }
        }
    </script>
</body>
</html>
